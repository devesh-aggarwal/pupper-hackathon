# One of the Pupper monorepo's 13 recorded tricks, as a tracking policy:
# monorepo_tricks.py replayed the recording in simulation like the robot's old
# player did (same speed), and the policy was trained on that motion.
description: From standing, sits, shakes a front paw, sits, and stands back up.
type: policy
policy: policy.json
start_pose: standing
end_pose: standing
max_body_angle_deg: 65   # the reference tilts up to 40 degrees
replaced_by: sit_stay_shake   # sit_stay_shake (Part 5) sits, stays and shakes on request instead
