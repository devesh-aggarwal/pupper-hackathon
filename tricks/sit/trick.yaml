# A trick trained as a tracking policy in pupper-mjlab (Mjlab-Tracking-Flat-Pupper-v3)
# and exported with export_trick.py. The policy JSON carries the reference motion.
description: From standing, steps its hind feet in, sits like a dog with its chest up, holds for two seconds, then stands back up.
type: policy
policy: policy.json
start_pose: standing
end_pose: standing
max_body_angle_deg: 60   # e-stop tilt limit while the trick plays (the sit leans 35 degrees)
replaced_by: sit_stay_shake   # sit_stay_shake (Part 5) sits, stays and shakes on request instead
