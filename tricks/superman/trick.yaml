# One of the Pupper monorepo's 13 recorded tricks, as a tracking policy:
# monorepo_tricks.py replayed the recording in simulation like the robot's old
# player did (same speed), and the policy was trained on that motion.
description: Lies down and stretches its legs out front and back like a flying superhero, then lies still.
type: policy
policy: policy.json
start_pose: standing
end_pose: lying
max_body_angle_deg: 60   # the reference tilts up to 31 degrees
